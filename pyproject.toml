[project]
name = "faof-lm"
version = "0.1.0"
description = "Minimal Future-Anchored Order-Free Chinese LM training code"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "torch>=2.5",
  "tqdm>=4.66",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faof"]

